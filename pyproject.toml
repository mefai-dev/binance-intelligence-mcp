[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binance-intelligence-mcp"
version = "1.1.0"
description = "MCP server providing 12 computed intelligence tools for Binance ··· accumulation detection, whale tracking, market impact simulation, smart money radar, pattern scanning, correlation matrix, regime classification, DCA backtesting, funding rate scanning, funding extremes detection, funding history analysis, and basis spread scanning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "mefai-dev" },
]
keywords = [
    "binance",
    "mcp",
    "trading",
    "intelligence",
    "crypto",
    "market-analysis",
    "whale-detection",
    "dca",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
binance-intelligence-mcp = "binance_intelligence:main"

[project.urls]
Homepage = "https://github.com/mefai-dev/binance-intelligence-mcp"
Repository = "https://github.com/mefai-dev/binance-intelligence-mcp"
Issues = "https://github.com/mefai-dev/binance-intelligence-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/binance_intelligence"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
